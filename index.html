<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Weather Check</h1>
  <p class="sub">Search any city or town to see current conditions.</p>

  <div class="search">
    <input type="text" id="cityInput" placeholder="e.g. Tezpur, Assam" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <button class="locate-btn" id="locateBtn">Use my current location</button>

  <div class="card" id="card">
    <div class="placeholder">Search a place to see its weather.</div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
